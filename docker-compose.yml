services:

  # ── PostgreSQL Database ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: allido-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-allido}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-allido_secret}
      POSTGRES_DB: ${DB_NAME:-allido_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"        # exposed so you can connect via a GUI tool (optional)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-allido} -d ${DB_NAME:-allido_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Express / Socket.io Backend ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: allido-backend
    restart: unless-stopped
    env_file:
      - .env               # loads your local .env at project root
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-allido}
      DB_PASSWORD: ${DB_PASSWORD:-allido_secret}
      DB_NAME: ${DB_NAME:-allido_db}
    ports:
      - "5000:5000"        # exposed for direct API access / debugging
    depends_on:
      db:
        condition: service_healthy

  # ── React Frontend (Nginx) ────────────────────────────────────────
  frontend:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: allido-frontend
    restart: unless-stopped
    ports:
      - "80:80"            # main app access point → http://localhost
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
