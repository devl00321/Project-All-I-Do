services:


  # ── Express / Socket.io Backend ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: allido-backend
    restart: unless-stopped
    env_file:
      - .env               # loads your local .env at project root
    environment:
      PORT: 5000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"        # exposed for direct API access / debugging
    depends_on:
      - redis

  # ── Redis (For OTP rate-limiting & caching) ───────────────────────
  redis:
    image: redis:alpine
    container_name: allido-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
  # ── React Frontend (Nginx) ────────────────────────────────────────
  frontend:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: allido-frontend
    restart: unless-stopped
    ports:
      - "80:80"            # main app access point → http://localhost
    depends_on:
      - backend

