services:


  # ── Express / Socket.io Backend ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: allido-backend
    restart: unless-stopped
    env_file:
      - .env               # loads your local .env at project root
    environment:
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
      NEON_DB_URL: ${NEON_DB_URL}
    ports:
      - "5000:5000"        # exposed for direct API access / debugging
  # ── React Frontend (Nginx) ────────────────────────────────────────
  frontend:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: allido-frontend
    restart: unless-stopped
    ports:
      - "80:80"            # main app access point → http://localhost
    depends_on:
      - backend

